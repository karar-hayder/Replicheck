name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests and linters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: |
          python -m black --check .
          python -m isort --check-only .

      - name: Lint
        run: python -m flake8 .

      - name: Test
        # pytest is configured with --cov=replicheck in pyproject.toml and a
        # fail_under of 90 in .coveragerc, so this step also enforces coverage.
        run: python -m pytest -q

  analyzer:
    name: C# analyzer builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        working-directory: utils/C#/ComplexityAnalyzer
        run: dotnet build -c Release
