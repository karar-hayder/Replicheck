# setup.cfg
[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501, S101, S110, S603, S404, S607
enable-extensions = B907, C4, S, ERA
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    migrations,
    __init__.py,
    tests/TodoFixme/test_TDFM.py,
    benchmarks/corpus,
    benchmarks/.tmp

max-complexity = 15

# Suppress plugin errors to fail silently
[flake8:local-plugins]

[isort]
# Keep isort compatible with Black, which uses an 88-character line length.
# Without this, isort wraps imports at 79 and Black unwraps them again, so the
# two tools in the pre-commit hook never converge.
profile = black
# Generated benchmark corpora are data, not project source.
# extend_skip adds to isort's defaults (.venv, venv, build, ...) rather than
# replacing them, which is what plain "skip" would do.
extend_skip = benchmarks/corpus,benchmarks/.tmp
